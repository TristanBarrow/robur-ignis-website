<!-- @dsCard group="Foundations" name="Spacing and radius" subtitle="Square system; rules, not boxes" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px}
    .cap{font-family:var(--font-mono);font-size:11px;color:var(--color-ink-faint);letter-spacing:.02em}
  </style>
</head><body>
<div id="root">
<div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Grid pitch</span><span class="cap" style="color:var(--color-ink-soft)">24px</span></div><div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Gutter</span><span class="cap" style="color:var(--color-ink-soft)">24px · 32px from 1024px</span></div><div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Row padding</span><span class="cap" style="color:var(--color-ink-soft)">20px</span></div><div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Stack</span><span class="cap" style="color:var(--color-ink-soft)">32px</span></div><div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Section padding</span><span class="cap" style="color:var(--color-ink-soft)">80px · 112px from 1024px</span></div><div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Content width</span><span class="cap" style="color:var(--color-ink-soft)">72rem</span></div><div style="display:grid;grid-template-columns:11rem 1fr;gap:16px;align-items:center;border-top:1px solid var(--color-rule);padding:10px 0"><span style="font-size:14px">Prose width</span><span class="cap" style="color:var(--color-ink-soft)">42rem</span></div><div style="margin-top:20px;display:flex;gap:24px;flex-wrap:wrap;align-items:center"><div style="width:96px;height:48px;border:1px solid var(--color-ink)"></div><span class="cap">0 radius: everything</span><div style="width:96px;height:48px;background:var(--color-ember);border-radius:5px"></div><span class="cap">5px: button only</span></div>
</div>
</body></html>
