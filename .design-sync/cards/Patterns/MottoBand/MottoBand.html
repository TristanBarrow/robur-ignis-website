<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px}

<div id="root">
<section style="margin:-24px;padding:48px 32px;background:var(--color-green-deep);color:var(--color-paper)"><p class="label" style="margin:0;color:rgb(243 244 238 / 0.65)">On the name</p><p style="margin:20px 0 0;font-family:var(--font-display);font-style:italic;font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.1;letter-spacing:-0.015em">Robur Ignis: the strength to withstand the fire.</p><p style="margin:28px 0 0;max-width:36rem;font-size:1.125rem;line-height:1.625;color:rgb(243 244 238 / 0.8)"><em style="font-family:var(--font-display);font-style:normal;color:var(--color-paper)">Robur</em> is Latin for oak, the hard timber the Romans also used as their word for strength. <em style="font-family:var(--font-display);font-style:normal;color:var(--color-paper)">Ignis</em> is fire.</p></section>
