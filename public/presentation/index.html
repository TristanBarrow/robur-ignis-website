<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/presentation/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENTR 150 Presentation</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Robur Ignis, matched to robur-ignis.com */
  :root {
    --paper: #f8f5ea;
    --paper-deep: #ebe5d1;
    --rule: #d8d0b8;
    --ink: #1e2214;
    --ink-soft: #4b4d3c;
    --ink-faint: #62634c;
    --green: #4a5a26;
    --green-deep: #283618;
    --ember: #c23a26;
    --tan: #dda15e;
    --display: "Besley", ui-serif, Georgia, serif;
    --sans: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--paper-deep);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* Fixed 1920x1080 stage, scaled to fit the window */
  .stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
  }

  /* Paper slides with the site's faint graph-paper grid */
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
    padding: 100px 200px 150px;
    background-color: var(--paper);
    background-image:
      linear-gradient(rgba(74, 90, 38, 0.08) 2px, transparent 2px),
      linear-gradient(90deg, rgba(74, 90, 38, 0.08) 2px, transparent 2px);
    background-size: 60px 60px;
    background-position: -2px -2px;
    outline: 2px solid var(--rule);
    overflow: hidden;
  }
  .slide.active { display: flex; }

  /* Fullscreen: slide fills the screen, no frame */
  :fullscreen body { background: var(--paper); }
  :fullscreen .slide { outline: none; }

  .slide h1, .slide h2 { font-family: var(--display); font-weight: 500; text-wrap: balance; max-width: 1500px; }
  .slide h1 { font-size: 128px; line-height: 1.08; letter-spacing: -0.02em; }
  .slide h2 { font-size: 100px; line-height: 1.1; letter-spacing: -0.015em; }
  .slide h3 {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ember);
  }
  .slide p { font-size: 44px; line-height: 1.6; color: var(--ink-soft); max-width: 1300px; }
  .slide strong { color: var(--ink); font-weight: 600; }
  .slide em { font-family: var(--display); font-style: normal; color: var(--ink); }
  .slide a { color: inherit; text-decoration: underline; text-decoration-color: rgba(30, 34, 20, 0.35); text-underline-offset: 0.25em; }

  /* Numbered lists: ruled rows, like the site's service list */
  .slide ol { list-style: none; counter-reset: item; max-width: 1300px; }
  .slide ol li {
    counter-increment: item;
    display: flex;
    align-items: baseline;
    gap: 40px;
    padding: 14px 0;
    border-top: 3px solid var(--green);
    font-family: var(--display);
    font-size: 44px;
    font-weight: 500;
    line-height: 1.2;
  }
  .slide ol li::before {
    content: counter(item, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 28px;
    color: var(--green);
  }
  .slide ul { list-style: none; font-size: 44px; line-height: 1.6; color: var(--ink-soft); }
  .slide ul li { padding-left: 1.2em; position: relative; }
  .slide ul li::before { content: "—"; position: absolute; left: 0; color: var(--green); }

  /* "→ ..." lines: what this stage hands to the next */
  .slide p.next {
    margin-top: 20px;
    padding-top: 32px;
    border-top: 3px solid var(--green);
    font-size: 40px;
    color: var(--ink);
  }
  .slide p.next .arrow { color: var(--ember); margin-right: 0.3em; }

  /* Statement slides (start with "# "): deep olive, italic display, like "On the name" */
  .slide.statement { background: var(--green-deep); color: var(--paper); }
  .slide.statement h1, .slide.statement h2 { font-style: italic; font-weight: 400; }
  .slide.statement p { color: rgba(248, 245, 234, 0.8); }
  .slide.statement .footer { border-color: rgba(248, 245, 234, 0.15); color: rgba(248, 245, 234, 0.65); }
  .slide.statement .footer .wordmark { color: var(--paper); }
  .slide.statement .footer .wordmark svg { color: var(--tan); }

  /* Photo slides: mounted like a print in a report */
  .slide.photo { align-items: center; }
  /* Size the print to the image; the caption wraps rather than widening the mat */
  .slide figure { display: flex; flex-direction: column; gap: 22px; width: min-content; }
  .slide figure .mat { padding: 20px; background: var(--paper-deep); border: 2px solid rgba(30, 34, 20, 0.8); }
  .slide figure img { display: block; max-height: 640px; max-width: 1200px; object-fit: contain; filter: saturate(0.9) contrast(1.04); }
  .slide figcaption { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 40px; white-space: nowrap; }
  .slide figcaption .name { font-family: var(--display); font-size: 40px; font-weight: 500; }
  .slide figcaption .label { font-family: var(--mono); font-size: 26px; color: var(--green); }

  /* Stage tracker, generated from "### Stage N" slides */
  .slide .pipeline {
    position: absolute;
    top: 80px;
    left: 200px;
    right: 200px;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 28px;
    max-width: none;
    list-style: none;
  }
  .slide .pipeline li {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 0 0;
    border-top: 3px solid var(--rule);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 400;
    line-height: 1.3;
    color: var(--ink-faint);
  }
  .slide .pipeline li::before { display: none; }
  .slide .pipeline .num { color: var(--ink-faint); }
  .slide .pipeline .done { border-color: var(--green); }
  .slide .pipeline .current { border-top: 8px solid var(--green); padding-top: 11px; color: var(--ink); font-weight: 500; }
  .slide .pipeline .current .num { color: var(--ember); }

  /* Footer: flame-nut wordmark and slide number, under a hairline rule */
  .footer {
    position: absolute;
    left: 200px;
    right: 200px;
    bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 2px solid var(--rule);
    font-family: var(--mono);
    font-size: 22px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .footer .wordmark { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-size: 28px; font-weight: 600; letter-spacing: -0.025em; color: var(--ink); }
  .footer .wordmark svg { width: 34px; height: 34px; color: var(--ember); }

  .progress {
    position: fixed;
    left: 0;
    bottom: 0;
    height: 4px;
    background: var(--ember);
    transition: width 0.2s ease;
  }

  /* Speaker notes, toggled with "n" */
  .notes {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 20px;
    max-height: 35vh;
    overflow: auto;
    display: none;
    padding: 16px 20px;
    background: var(--ink);
    color: var(--paper);
    border-top: 3px solid var(--green);
    font-size: 18px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  body.show-notes .notes { display: block; }

  /* Home link, top left; hidden in fullscreen so it never shows while presenting */
  .home {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    background: var(--green-deep);
    color: var(--tan);
    opacity: 0.85;
    transition: opacity 0.15s ease;
  }
  .home:hover, .home:focus-visible { opacity: 1; }
  .home:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .home svg { width: 24px; height: 24px; }
  :fullscreen .home { display: none; }

  .error { padding: 40px; font-size: 20px; }
</style>
</head>
<body>
  <a class="home" href="/" title="Robur Ignis home" aria-label="Robur Ignis home"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 12.4C5.7 10.2 6.1 7.8 7.6 5.6C7.9 6.9 8.6 7.7 9.6 8.1C9.4 5.2 10.9 2.8 12.9 0.5C12.3 3.3 14.6 4.8 15.1 7.4C15.8 6.9 16.4 6.2 16.8 5.4C18.3 7.6 18.4 10.2 17.6 12.4Z"/><path d="M4.6 14.8C4.6 19 8 21.4 12 21.4C16 21.4 19.4 19 19.4 14.8C19.4 14 18.8 13.4 18 13.4H6C5.2 13.4 4.6 14 4.6 14.8Z"/><path d="M11.3 21.1C11.3 22.2 11.9 23.2 13.3 23.7L13.8 22.9C12.9 22.5 12.7 21.9 12.7 21.1Z"/></svg></a>
  <div class="stage" id="stage"></div>
  <div class="progress" id="progress"></div>
  <div class="notes" id="notes"></div>

<script>
  const stage = document.getElementById('stage');
  const progress = document.getElementById('progress');
  const notesEl = document.getElementById('notes');
  let slides = [];
  let notes = [];
  let current = (parseInt(location.hash.slice(1)) || 1) - 1;
  let lastSource = '';

  // Minimal markdown: headings, paragraphs, lists, bold, italic, links, images.
  const escape = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function inline(s) {
    return escape(s)
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  // ![Name](file.jpg "Label") on its own line becomes a captioned print.
  const IMAGE = /^!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)$/;

  const FLAME = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 12.4C5.7 10.2 6.1 7.8 7.6 5.6C7.9 6.9 8.6 7.7 9.6 8.1C9.4 5.2 10.9 2.8 12.9 0.5C12.3 3.3 14.6 4.8 15.1 7.4C15.8 6.9 16.4 6.2 16.8 5.4C18.3 7.6 18.4 10.2 17.6 12.4Z"/><path d="M4.6 14.8C4.6 19 8 21.4 12 21.4C16 21.4 19.4 19 19.4 14.8C19.4 14 18.8 13.4 18 13.4H6C5.2 13.4 4.6 14 4.6 14.8Z"/><path d="M11.3 21.1C11.3 22.2 11.9 23.2 13.3 23.7L13.8 22.9C12.9 22.5 12.7 21.9 12.7 21.1Z"/></svg>';

  function render(md) {
    const out = [];
    let para = [], list = null;
    const flushPara = () => {
      if (para.length) {
        const text = para.join(' ');
        const img = text.match(IMAGE);
        if (img) {
          const [, alt, src, label = ''] = img;
          const caption = alt || label ? `<figcaption><span class="name">${escape(alt)}</span><span class="label">${escape(label)}</span></figcaption>` : '';
          out.push(`<figure><div class="mat"><img src="${escape(src)}" alt="${escape(alt)}"></div>${caption}</figure>`);
        }
        else if (text.startsWith('→')) out.push(`<p class="next"><span class="arrow">→</span>${inline(text.slice(1).trim())}</p>`);
        else out.push(`<p>${inline(text)}</p>`);
      }
      para = [];
    };
    const flushList = () => { if (list) out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null; };

    for (const line of md.replace(/<!--[\s\S]*?-->/g, '').split('\n')) {
      let m;
      if (!line.trim()) { flushPara(); flushList(); }
      else if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); flushList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
      else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/))) {
        flushPara();
        const tag = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
        list.items.push(m[2]);
      }
      else { flushList(); para.push(line.trim()); }
    }
    flushPara(); flushList();
    return out.join('\n');
  }

  function build(source) {
    const chunks = source.split(/^---\s*$/m);

    // Collect "### Stage N" + "## Name" pairs to build the stage tracker.
    const stageNames = [];
    for (const chunk of chunks) {
      const n = chunk.match(/^###\s+Stage\s+(\d+)\s*$/m);
      const name = chunk.match(/^##\s+(.+)$/m);
      if (n && name) stageNames[n[1] - 1] = name[1].trim();
    }
    const tracker = current => `<ol class="pipeline">${stageNames.map((name, i) => {
      const state = i + 1 < current ? 'done' : i + 1 === current ? 'current' : '';
      return `<li class="${state}"><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${escape(name)}</span></li>`;
    }).join('')}</ol>`;

    stage.innerHTML = '';
    notes = [];
    slides = chunks.map((chunk, i) => {
      const [body, note = ''] = chunk.split(/^Note:\s*$/m);
      notes.push(note.trim());
      const n = body.match(/^###\s+Stage\s+(\d+)\s*$/m);
      const s = document.createElement('section');
      const first = body.replace(/<!--[\s\S]*?-->/g, '').trim();
      s.className = 'slide'
        + (/^#\s/.test(first) ? ' statement' : '')
        + (IMAGE.test(first) ? ' photo' : '');
      s.innerHTML = (n ? tracker(+n[1]) : '') + render(body.trim())
        + `<div class="footer"><span class="wordmark">${FLAME}Robur Ignis</span><span>${String(i + 1).padStart(2, '0')} / ${String(chunks.length).padStart(2, '0')}</span></div>`;
      stage.appendChild(s);
      return s;
    });
    show(current);
  }

  function show(i) {
    current = Math.min(Math.max(i, 0), slides.length - 1);
    slides.forEach((s, j) => s.classList.toggle('active', j === current));
    progress.style.width = `${((current + 1) / slides.length) * 100}%`;
    notesEl.textContent = notes[current] || '(no notes)';
    history.replaceState(null, '', `#${current + 1}`);
  }

  function fit() {
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080) * (document.fullscreenElement ? 1 : 0.96);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }

  // Reload slides.md whenever it changes, keeping the current slide.
  async function load() {
    try {
      const res = await fetch('slides.md', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const source = await res.text();
      if (source !== lastSource) { lastSource = source; build(source); }
    } catch (err) {
      if (!lastSource) stage.innerHTML = `<div class="error">Couldn't load slides.md (${err.message}). Serve this folder over HTTP, e.g. <code>python3 -m http.server</code>.</div>`;
    }
  }

  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) show(current + 1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) show(current - 1);
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'n') document.body.classList.toggle('show-notes');
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else return;
    e.preventDefault();
  });

  stage.addEventListener('click', e => show(current + (e.clientX > innerWidth / 3 ? 1 : -1)));

  addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  fit();
  load();
  setInterval(load, 1000);
</script>
