<!doctype html>
<!--
  Share image template for articles (1200×630, the size LinkedIn and others use).
  Title and subtitle come from the query string, e.g.
    article.html?title=Hacked&subtitle=How%20AI%20changed%20security...
  Render with headless Chrome, saving to public/og/<article>.png:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=5000 --screenshot=public/og/hacked.png \
      "file://$PWD/design/og/article.html?title=...&subtitle=..."
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Besley:wght@500;600&family=IBM+Plex+Mono:wght@400&family=Public+Sans:wght@400&display=block"
    />
    <style>
      :root {
        --paper: #f8f5ea;
        --green-deep: #283618;
        --tan: #dda15e;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 72px 88px 64px;
        background-color: var(--green-deep);
        /* The hero's engineering-pad grid, in tan on green. */
        background-image:
          linear-gradient(color-mix(in srgb, var(--tan) 7%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in srgb, var(--tan) 7%, transparent) 1px, transparent 1px);
        background-size: 32px 32px;
        color: var(--paper);
        font-family: "Public Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Besley", serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .wordmark svg {
        width: 40px;
        height: 40px;
        fill: var(--tan);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px;
        letter-spacing: 0.04em;
        color: var(--tan);
      }
      h1 {
        margin-top: 14px;
        font-family: "Besley", serif;
        font-size: 120px;
        font-weight: 500;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin-top: 22px;
        max-width: 900px;
        font-size: 38px;
        line-height: 1.3;
        color: color-mix(in srgb, var(--paper) 82%, transparent);
      }
      footer {
        display: flex;
        justify-content: space-between;
        padding-top: 22px;
        border-top: 2px solid color-mix(in srgb, var(--paper) 18%, transparent);
        font-family: "IBM Plex Mono", monospace;
        font-size: 22px;
        color: color-mix(in srgb, var(--paper) 68%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="wordmark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6.4 12.4C5.7 10.2 6.1 7.8 7.6 5.6C7.9 6.9 8.6 7.7 9.6 8.1C9.4 5.2 10.9 2.8 12.9 0.5C12.3 3.3 14.6 4.8 15.1 7.4C15.8 6.9 16.4 6.2 16.8 5.4C18.3 7.6 18.4 10.2 17.6 12.4Z" />
        <path d="M4.6 14.8C4.6 19 8 21.4 12 21.4C16 21.4 19.4 19 19.4 14.8C19.4 14 18.8 13.4 18 13.4H6C5.2 13.4 4.6 14 4.6 14.8Z" />
        <path d="M11.3 21.1C11.3 22.2 11.9 23.2 13.3 23.7L13.8 22.9C12.9 22.5 12.7 21.9 12.7 21.1Z" />
      </svg>
      Robur Ignis
    </div>
    <main>
      <p class="label">Article</p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </main>
    <footer>
      <span>Tristan Barrow</span>
      <span>robur-ignis.com</span>
    </footer>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("title").textContent = params.get("title") ?? "Title";
      document.getElementById("subtitle").textContent = params.get("subtitle") ?? "";
    </script>
  </body>
</html>
